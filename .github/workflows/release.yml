name: Release skill package

# 打 tag（v1.0.0）时自动打包成 zip，供豆包 / WorkBuddy 客户端直接上传，
# 也支持「发一句链接让 AI 自己装」的场景。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 SKILL.md 存在且含 YAML frontmatter
        run: |
          test -f SKILL.md || (echo "缺少 SKILL.md" && exit 1)
          head -1 SKILL.md | grep -q '^---$' || (echo "SKILL.md 缺少 YAML frontmatter" && exit 1)
          echo "校验通过"

      - name: 打包
        run: |
          zip -r homework-photo-answer.zip . \
            -x "*.git*" -x "*.github*" -x "*.venv*" \
            -x "*.jpg" -x "*.jpeg" -x "*.png" -x "*.pdf" -x "*.zip"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: homework-photo-answer.zip
